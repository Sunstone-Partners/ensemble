name: Claude Code Review

# DISABLED: this review action requires a valid CLAUDE_CODE_OAUTH_TOKEN secret,
# which is not configured on this repository — every same-repo PR run dies ~20s
# in with a 401 ("Claude Code is not installed on this repository"), flagging the
# `claude-review` check red for a review that can never run. Until the OAuth token
# is provisioned, run only via manual dispatch so it no longer gates PRs. To
# re-enable automatic review, restore the `pull_request` trigger below:
#
#   pull_request:
#     types: [opened, synchronize]
#
on:
  workflow_dispatch:

jobs:
  claude-review:
    # GitHub withholds secrets and the OIDC token from `pull_request` runs
    # triggered by a fork, so claude_code_oauth_token arrives empty and the
    # action dies ~20s in ("Secret source: None", "Unable to get
    # ACTIONS_ID_TOKEN_REQUEST_URL"). Skip rather than fail: an unreviewable
    # fork PR should not be flagged red for a review that could never run.
    if: github.event.pull_request.head.repo.full_name == github.repository

    # Optional: Filter by PR author. Fold any extra condition into the `if`
    # above with `&&` -- a second job-level `if:` key is a YAML duplicate.
    #   && (github.event.pull_request.user.login == 'external-contributor' || ...)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

