name: Release Plugin
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm test` includes packages/router's Python suite, which fails in CI
      # without pytest (by design, #75). Same setup as test.yml.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python3 -m pip install --quiet 'pytest==9.1.1'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run validation
        run: npm run validate

      - name: Verify version sync
        run: node scripts/validate-version-sync.js

      - name: Run tests
        run: npm test

      - name: Generate release notes
        run: npm run release-notes -- --output .github/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: .github/release-notes.md
          generate_release_notes: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
