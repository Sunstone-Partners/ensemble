api_version: ensemble.sunstone.dev/v1
kind: Behavior
metadata:
  name: fix-failing-test
  version: 1.0.0
trigger:
  event_type: test.failure.observed
  predicate:
    # Deliberately the same runner list as investigate-test-failure, not a
    # looser `isError` alone. A bare isError predicate fires on ANY errored
    # bash command, including ones that have nothing to do with a test suite.
    command: { matches: "npm test|npx jest|jest|vitest|mix test|pytest|go test|cargo test" }
    isError: { equals: true }
policy:
  # Changed from `auto` to `propose` (2026-09-25): a live run produced a
  # change to packages/agent-core/src/behavior/outbox.ts
  # (`if (this.entries.length > 0) return;`) that landed uncommitted with no
  # human review. `propose` makes MutationGuard.authorize() deny every
  # direct mutation and require a human to apply the proposal instead
  # (mutation-guard.ts:122-130) -- but ONLY on the governed dispatch path.
  #
  # This does NOT close the gap below: the continuation path bypasses
  # MutationGuard regardless of `mode`, and a `bash`-granted behavior can
  # write straight past MutationGuard/WorkspaceSnapshot via shell redirection
  # (write-boundary-monitor.ts's docstring documents exactly this happening
  # with a live model and `printf > file`). Both are open as br-o355. Treat
  # `propose` as raising the bar, not as a closed loop, until br-o355 lands.
  mode: propose
  timeout: 10m
capabilities:
  # `edit` is the difference between this behavior and
  # investigate-test-failure, which is read-only and therefore can observe a
  # failure without ever repairing it.
  #
  # What mutation_classes buys depends on WHICH dispatch path runs, and there
  # are two:
  #
  #   governed     behavior-runner.runBehavior -> AutofixLoop, constructed
  #                with createMutationGuard(compiled) at behavior-runner.ts:123.
  #                Every write is authorized against this list, snapshotted,
  #                and verified against execution.test_command over the whole
  #                suite before acceptance.
  #
  #   continuation pi.sendUserMessage injects a turn and the MODEL applies the
  #                change with its own edit calls. Snapshot, verification and
  #                rollback still apply; MutationGuard does not, because no
  #                write passes through it. agent-fix-provider.ts:14 says so
  #                outright.
  #
  # The run that proved this behavior worked logged a continuation and no
  # dispatch/invocation record at all -- so the continuation path is what
  # fires in practice, and this list was not consulted. The gap is that the
  # two paths diverge. That is br-o355.
  #
  # CORRECTION (br-zcxb): the note that used to end this paragraph -- "the
  # guard is wired, not dead code" -- was wrong. runBehavior has ZERO callers
  # anywhere in the repo, including tests:
  #
  #   $ grep -rn runBehavior packages/*/src packages/*/tests \
  #       | grep -v behavior-runner.ts
  #   (no output)
  #
  # So the governed path is unreachable in full, and every guarantee described
  # above is enforced in code that never executes. br-xz6q (policy.mode not
  # gating the continuation path) was one visible symptom of that.
  tools: [read, grep, glob, bash, edit]
  #
  # constitution.propose is the right to ASK for a constitution amendment, not
  # to write one: a proposal still requires human approval before it is
  # applied. Without it the behavior can repair a failing test forever and
  # never record what would stop the failure recurring, which is the whole
  # point of the loop.
  #
  # Inert until br-zcxb lands -- the constitution step is only called from the
  # dead governed path, so nothing will exercise this grant until the live
  # loop can reach it.
  mutation_classes: [artifact.write, constitution.propose]
execution:
  graph: fix-failing-test
  # The whole-suite check. BOTH dispatch paths re-run this before accepting
  # a fix: the governed AutofixLoop, and the continuation path's
  # verification (extension.ts verifyPendingFix), which runs it after the
  # narrow failing command passes. A repair that greens its target while
  # breaking three others is rolled back.
  #
  # Runs from the repository root. It was `npx jest`, which was checked with
  # `npx jest --listTests` (170 suites) -- but listing is not loading. With
  # no root jest config, every TypeScript suite fails to parse at the root
  # (66 of them), so the check failed for every fix, correct ones included,
  # and every fix was rolled back (br-srbd). `npm test` runs each
  # workspace's own configured runner, the same command CI runs.
  # Slower (about a minute) but real.
  #
  # `env -u CI`: omp sets CI=true for every tool process, so a local run
  # looks like CI. packages/router's test script deliberately exits 1 under
  # CI when pytest is missing, so on any machine without pytest every
  # verification failed -- observed, with 3189 jest tests passing and a
  # correct fix rolled back. Without CI it skips with a visible message if
  # pytest is absent and runs if present; real CI still enforces it.
  # Nothing else in the suite reads CI.
  test_command: env -u CI npm test
outcomes:
  - test.failure.investigated
