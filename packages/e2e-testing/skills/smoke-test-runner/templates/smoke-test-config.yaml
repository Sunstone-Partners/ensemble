# Smoke Test Configuration Template
# Version: 1.0.0
# Schema: schemas/smoke-test-config-schema.json

# Environment-specific configurations for smoke test execution
environments:
  # Pre-release environment (local development, CI/CD)
  pre-release:
    baseUrl: https://localhost:3000
    database:
      host: localhost
      port: 5432
      database: app_test
      ssl: false
    timeout: 5000  # 5 seconds
    criticalPathsOnly: false

  # Staging environment (pre-production testing)
  staging:
    baseUrl: https://staging.example.com
    database:
      host: staging-db.example.com
      port: 5432
      database: app_staging
      ssl: true
    timeout: 5000  # 5 seconds
    criticalPathsOnly: false

  # Production environment (live system)
  production:
    baseUrl: https://api.example.com
    database:
      host: prod-db.example.com
      port: 5432
      database: app_production
      ssl: true
    timeout: 3000  # 3 seconds (stricter)
    criticalPathsOnly: false

  # Canary environment (progressive rollout)
  canary:
    baseUrl: https://canary.example.com
    database:
      host: prod-db.example.com
      port: 5432
      database: app_production
      ssl: true
    timeout: 2000  # 2 seconds (strictest)
    criticalPathsOnly: true  # Reduced scope for faster validation

# Smoke test category configurations
smokeTests:
  # Category 1: API Health
  # Purpose: Verify all critical API endpoints are responding correctly
  # Timing: ≤30 seconds
  api:
    endpoints:
      # Health check endpoints
      - path: /health
        expectedStatus: 200
        method: GET
        maxDuration: 500  # 500ms

      - path: /api/health
        expectedStatus: 200
        method: GET
        maxDuration: 500

      # Authentication endpoints
      - path: /api/auth/login
        expectedStatus: 200
        method: POST
        body:
          username: "smoke-test-user@example.com"
          password: "${SMOKE_TEST_PASSWORD}"
        maxDuration: 1000  # 1 second

      - path: /api/auth/logout
        expectedStatus: 200
        method: POST
        headers:
          Authorization: "Bearer ${AUTH_TOKEN}"
        maxDuration: 500

      # Core CRUD endpoints
      - path: /api/users
        expectedStatus: 200
        method: GET
        headers:
          Authorization: "Bearer ${AUTH_TOKEN}"
        maxDuration: 1000

      - path: /api/products
        expectedStatus: 200
        method: GET
        maxDuration: 1000

      - path: /api/orders
        expectedStatus: 200
        method: GET
        headers:
          Authorization: "Bearer ${AUTH_TOKEN}"
        maxDuration: 1000

      # Public endpoints
      - path: /api/public/info
        expectedStatus: 200
        method: GET
        maxDuration: 500

      # Admin endpoints
      - path: /api/admin/dashboard
        expectedStatus: 200
        method: GET
        headers:
          Authorization: "Bearer ${ADMIN_TOKEN}"
        maxDuration: 1000

  # Category 2: Database Connectivity
  # Purpose: Verify database is accessible and responding correctly
  # Timing: ≤20 seconds
  database:
    connectionString: "${DATABASE_URL}"
    testTable: smoke_test_table
    queries:
      read: "SELECT 1"  # Simple read test
      write: "INSERT INTO smoke_test_table (test_data, created_at) VALUES (?, NOW())"  # Write test

  # Category 3: External Services
  # Purpose: Verify third-party integrations are accessible
  # Timing: ≤30 seconds
  externalServices:
    # Payment gateway (Stripe)
    - name: stripe
      type: payment
      endpoint: https://api.stripe.com/v1/health
      apiKey: "${STRIPE_API_KEY}"
      headers:
        Authorization: "Bearer ${STRIPE_API_KEY}"
      maxDuration: 2000  # 2 seconds

    # Email service (SendGrid)
    - name: sendgrid
      type: email
      endpoint: https://api.sendgrid.com/v3/health
      apiKey: "${SENDGRID_API_KEY}"
      headers:
        Authorization: "Bearer ${SENDGRID_API_KEY}"
      maxDuration: 2000

    # Cloud storage (AWS S3)
    - name: aws-s3
      type: storage
      endpoint: https://s3.amazonaws.com/health
      apiKey: "${AWS_ACCESS_KEY_ID}"
      headers:
        Authorization: "AWS4-HMAC-SHA256 ${AWS_SIGNATURE}"
      maxDuration: 2000

    # Authentication provider (Auth0)
    - name: auth0
      type: auth
      endpoint: https://dev-example.auth0.com/api/v2/
      apiKey: "${AUTH0_API_KEY}"
      headers:
        Authorization: "Bearer ${AUTH0_API_KEY}"
      maxDuration: 2000

    # Analytics (Google Analytics)
    - name: google-analytics
      type: analytics
      endpoint: https://www.google-analytics.com/collect
      maxDuration: 2000

  # Category 4: Authentication
  # Purpose: Verify authentication and authorization flows
  # Timing: ≤20 seconds
  auth:
    testUser:
      username: smoke-test-user@example.com
      password: "${SMOKE_TEST_PASSWORD}"
    endpoints:
      login: /api/auth/login
      logout: /api/auth/logout
      protected: /api/protected

  # Category 5: Critical Paths
  # Purpose: Verify end-to-end critical user journeys
  # Timing: ≤80 seconds (3-5 journeys, 15s each)
  criticalPaths:
    # Journey 1: User Signup Flow
    - name: signup
      description: Complete user registration flow
      maxDuration: 15000  # 15 seconds
      critical: true
      steps:
        - action: navigateToSignup
          endpoint: /api/signup
          method: GET
          expectedStatus: 200

        - action: submitSignupForm
          endpoint: /api/signup
          method: POST
          body:
            email: "test-${TIMESTAMP}@example.com"
            password: "TestPassword123!"
            name: "Test User"
          expectedStatus: 201

        - action: verifyEmail
          endpoint: /api/auth/verify-email
          method: POST
          body:
            token: "${VERIFICATION_TOKEN}"
          expectedStatus: 200

    # Journey 2: Checkout Flow
    - name: checkout
      description: Complete purchase flow from cart to order confirmation
      maxDuration: 20000  # 20 seconds
      critical: true
      steps:
        - action: addToCart
          endpoint: /api/cart/add
          method: POST
          body:
            productId: "test-product-001"
            quantity: 1
          expectedStatus: 200

        - action: proceedToCheckout
          endpoint: /api/checkout/init
          method: POST
          expectedStatus: 200

        - action: enterPayment
          endpoint: /api/checkout/payment
          method: POST
          body:
            paymentMethod: "test_card"
            cardNumber: "4242424242424242"
            expiry: "12/25"
            cvv: "123"
          expectedStatus: 200

        - action: placeOrder
          endpoint: /api/orders
          method: POST
          expectedStatus: 201

        - action: confirmOrder
          endpoint: /api/orders/${ORDER_ID}
          method: GET
          expectedStatus: 200

    # Journey 3: Product Search and Filtering
    - name: search
      description: Search and filter products
      maxDuration: 10000  # 10 seconds
      critical: true
      steps:
        - action: searchProducts
          endpoint: /api/products/search
          method: GET
          body:
            query: "laptop"
          expectedStatus: 200

        - action: applyFilters
          endpoint: /api/products/search
          method: GET
          body:
            query: "laptop"
            filters:
              price:
                min: 500
                max: 1500
              brand: "Example Brand"
          expectedStatus: 200

        - action: viewProductDetails
          endpoint: /api/products/${PRODUCT_ID}
          method: GET
          expectedStatus: 200

    # Journey 4: Content Creation (Posts/Comments)
    - name: content-creation
      description: Create and publish content
      maxDuration: 12000  # 12 seconds
      critical: false
      steps:
        - action: createPost
          endpoint: /api/posts
          method: POST
          body:
            title: "Test Post ${TIMESTAMP}"
            content: "This is a test post created during smoke tests."
            tags: ["test", "smoke-test"]
          expectedStatus: 201

        - action: addComment
          endpoint: /api/posts/${POST_ID}/comments
          method: POST
          body:
            content: "Test comment"
          expectedStatus: 201

        - action: publishPost
          endpoint: /api/posts/${POST_ID}/publish
          method: POST
          expectedStatus: 200

    # Journey 5: Admin Dashboard Access
    - name: admin-dashboard
      description: Access admin dashboard and view metrics
      maxDuration: 10000  # 10 seconds
      critical: false
      steps:
        - action: loginAsAdmin
          endpoint: /api/auth/login
          method: POST
          body:
            username: "admin@example.com"
            password: "${ADMIN_PASSWORD}"
          expectedStatus: 200

        - action: accessDashboard
          endpoint: /api/admin/dashboard
          method: GET
          headers:
            Authorization: "Bearer ${ADMIN_TOKEN}"
          expectedStatus: 200

        - action: viewMetrics
          endpoint: /api/admin/metrics
          method: GET
          headers:
            Authorization: "Bearer ${ADMIN_TOKEN}"
          expectedStatus: 200

# Environment variable placeholders:
# ${SMOKE_TEST_PASSWORD} - Password for smoke test user
# ${AUTH_TOKEN} - Authentication token for protected endpoints
# ${ADMIN_TOKEN} - Admin authentication token
# ${DATABASE_URL} - Database connection string
# ${STRIPE_API_KEY} - Stripe API key
# ${SENDGRID_API_KEY} - SendGrid API key
# ${AWS_ACCESS_KEY_ID} - AWS access key ID
# ${AWS_SIGNATURE} - AWS request signature
# ${AUTH0_API_KEY} - Auth0 API key
# ${VERIFICATION_TOKEN} - Email verification token
# ${TIMESTAMP} - Current timestamp for unique values
# ${ORDER_ID} - Order ID from previous step
# ${PRODUCT_ID} - Product ID for details view
# ${POST_ID} - Post ID from creation step
# ${ADMIN_PASSWORD} - Admin user password

# =============================================================================
# Standalone per-category templates
# Merged from the former per-category smoke-test skills. Each block under
# `categoryTemplates.<category>` is a complete, self-contained configuration for
# running that category on its own (keyed by environment: preRelease, staging,
# canary5, canary25, canary100, production, rollback, slaTargets).
# =============================================================================
categoryTemplates:
  api:
    # API Smoke Test Configuration Template
    #
    # This template provides comprehensive examples for configuring API smoke tests
    # across multiple environments with health checks, CRUD operations, and error handling.
    #
    # Usage:
    #   1. Copy this template to your project
    #   2. Update environment-specific URLs and credentials
    #   3. Customize endpoints for your API
    #   4. Run tests: node execute-health-checks.js --config health-check-config.yaml

    # Pre-Release Environment
    preRelease:
      environment: pre-release
      baseUrl: https://pre-release.example.com
      timeout: 5000
      retries: 2
      retryDelay: 1000
      validateSSL: true
      followRedirects: true
      stopOnFirstFailure: false

      # Authentication configuration
      auth:
        type: bearer  # Options: bearer, basic, apikey
        token: ${PRE_RELEASE_AUTH_TOKEN}  # Environment variable

      # Global headers
      headers:
        User-Agent: SmokeTestAPI/1.0
        Accept: application/json
        Content-Type: application/json

      # Endpoints to test
      endpoints:
        # 1. System Health Checks
        - name: system-health
          path: /health
          method: GET
          expectedStatus: 200
          sla: 100  # Target: ≤100ms
          validateResponse:
            - field: status
              value: ok
            - field: version
              type: string

        - name: database-health
          path: /health/db
          method: GET
          expectedStatus: 200
          sla: 200
          validateResponse:
            - field: connected
              value: true
            - field: responseTime
              type: number
              max: 100

        - name: cache-health
          path: /health/cache
          method: GET
          expectedStatus: 200
          sla: 200
          validateResponse:
            - field: connected
              value: true

        # 2. Critical API Endpoints
        - name: list-users
          path: /api/v1/users
          method: GET
          expectedStatus: 200
          sla: 500
          validateResponse:
            - field: data
              type: array
            - field: pagination.total
              type: number

        - name: search-users
          path: /api/v1/search
          method: GET
          expectedStatus: 200
          sla: 2000
          query:
            q: test
            limit: 10
          validateResponse:
            - field: results
              type: array

        # 3. Error Handling Tests
        - name: not-found-test
          path: /api/v1/nonexistent
          method: GET
          expectedStatus: 404
          sla: 100

    # Staging Environment
    staging:
      environment: staging
      baseUrl: https://staging.example.com
      timeout: 5000
      retries: 2
      retryDelay: 1000
      validateSSL: true
      followRedirects: true

      auth:
        type: bearer
        token: ${STAGING_AUTH_TOKEN}

      headers:
        User-Agent: SmokeTestAPI/1.0
        Accept: application/json
        Content-Type: application/json

      endpoints:
        # Health checks
        - name: system-health
          path: /health
          method: GET
          expectedStatus: 200
          sla: 100

        - name: database-health
          path: /health/db
          method: GET
          expectedStatus: 200
          sla: 200

        # CRUD operations
        - name: create-resource
          path: /api/v1/resources
          method: POST
          expectedStatus: 201
          sla: 1000
          body:
            name: Smoke Test Resource
            type: test
          validateResponse:
            - field: id
              type: string
            - field: name
              value: Smoke Test Resource

        - name: read-resource
          path: /api/v1/resources
          method: GET
          expectedStatus: 200
          sla: 500
          validateResponse:
            - field: data
              type: array

        # Authentication tests
        - name: protected-endpoint
          path: /api/v1/protected
          method: GET
          expectedStatus: 200
          sla: 500

    # Canary Environment (5% traffic)
    canary5:
      environment: canary-5
      baseUrl: https://canary.example.com
      timeout: 5000
      retries: 2
      validateSSL: true

      auth:
        type: bearer
        token: ${CANARY_AUTH_TOKEN}

      headers:
        User-Agent: SmokeTestAPI/1.0
        Accept: application/json

      # Critical endpoints only for canary testing
      endpoints:
        - name: system-health
          path: /health
          method: GET
          expectedStatus: 200
          sla: 100

        - name: critical-api
          path: /api/v1/critical
          method: GET
          expectedStatus: 200
          sla: 500

    # Canary Environment (25% traffic)
    canary25:
      environment: canary-25
      baseUrl: https://canary.example.com
      timeout: 5000
      retries: 2
      validateSSL: true

      auth:
        type: bearer
        token: ${CANARY_AUTH_TOKEN}

      headers:
        User-Agent: SmokeTestAPI/1.0
        Accept: application/json

      endpoints:
        - name: system-health
          path: /health
          method: GET
          expectedStatus: 200
          sla: 100

        - name: database-health
          path: /health/db
          method: GET
          expectedStatus: 200
          sla: 200

        - name: critical-api
          path: /api/v1/critical
          method: GET
          expectedStatus: 200
          sla: 500

        - name: list-users
          path: /api/v1/users
          method: GET
          expectedStatus: 200
          sla: 500

    # Canary Environment (100% traffic)
    canary100:
      environment: canary-100
      baseUrl: https://canary.example.com
      timeout: 5000
      retries: 2
      validateSSL: true

      auth:
        type: bearer
        token: ${CANARY_AUTH_TOKEN}

      headers:
        User-Agent: SmokeTestAPI/1.0
        Accept: application/json

      # Full smoke test suite for 100% canary
      endpoints:
        - name: system-health
          path: /health
          method: GET
          expectedStatus: 200
          sla: 100

        - name: database-health
          path: /health/db
          method: GET
          expectedStatus: 200
          sla: 200

        - name: cache-health
          path: /health/cache
          method: GET
          expectedStatus: 200
          sla: 200

        - name: list-users
          path: /api/v1/users
          method: GET
          expectedStatus: 200
          sla: 500

        - name: search-users
          path: /api/v1/search
          method: GET
          expectedStatus: 200
          sla: 2000
          query:
            q: test
            limit: 10

        - name: create-resource
          path: /api/v1/resources
          method: POST
          expectedStatus: 201
          sla: 1000
          body:
            name: Canary Test Resource

    # Production Environment
    production:
      environment: production
      baseUrl: https://api.example.com
      timeout: 5000
      retries: 3  # More retries in production
      retryDelay: 2000
      validateSSL: true
      followRedirects: true
      stopOnFirstFailure: true  # Stop immediately on production failure

      auth:
        type: bearer
        token: ${PRODUCTION_AUTH_TOKEN}

      headers:
        User-Agent: SmokeTestAPI/1.0
        Accept: application/json
        Content-Type: application/json

      endpoints:
        # Critical health checks only in production
        - name: system-health
          path: /health
          method: GET
          expectedStatus: 200
          sla: 100

        - name: database-health
          path: /health/db
          method: GET
          expectedStatus: 200
          sla: 200

        - name: cache-health
          path: /health/cache
          method: GET
          expectedStatus: 200
          sla: 200

        # Critical API endpoints
        - name: list-users
          path: /api/v1/users
          method: GET
          expectedStatus: 200
          sla: 500

        # Authentication validation
        - name: protected-endpoint
          path: /api/v1/protected
          method: GET
          expectedStatus: 200
          sla: 500

    # Post-Rollback Environment (validates rollback success)
    rollback:
      environment: rollback
      baseUrl: https://api.example.com  # Production URL after rollback
      timeout: 5000
      retries: 2
      validateSSL: true

      auth:
        type: bearer
        token: ${PRODUCTION_AUTH_TOKEN}

      headers:
        User-Agent: SmokeTestAPI/1.0
        Accept: application/json

      # Comprehensive validation after rollback
      endpoints:
        - name: system-health
          path: /health
          method: GET
          expectedStatus: 200
          sla: 100

        - name: database-health
          path: /health/db
          method: GET
          expectedStatus: 200
          sla: 200

        - name: cache-health
          path: /health/cache
          method: GET
          expectedStatus: 200
          sla: 200

        - name: list-users
          path: /api/v1/users
          method: GET
          expectedStatus: 200
          sla: 500

        - name: search-users
          path: /api/v1/search
          method: GET
          expectedStatus: 200
          sla: 2000
          query:
            q: test
            limit: 10

        - name: protected-endpoint
          path: /api/v1/protected
          method: GET
          expectedStatus: 200
          sla: 500

    # Performance SLA Targets
    slaTargets:
      health: 100       # Health endpoints: ≤100ms
      read: 500         # Read operations: ≤500ms
      write: 1000       # Write operations: ≤1000ms
      search: 2000      # Search operations: ≤2000ms
      default: 5000     # Default timeout: ≤5000ms

  database:
    # Database Smoke Test Configuration Template
    #
    # This template provides comprehensive examples for configuring database smoke tests
    # across multiple environments with connectivity, performance, schema, and integrity validation.
    #
    # Usage:
    #   1. Copy this template to your project
    #   2. Update environment-specific connection details and credentials
    #   3. Customize tests for your database schema
    #   4. Run tests: node test-connectivity.js --config database-config.yaml

    # Pre-Release Environment
    preRelease:
      environment: pre-release
      database:
        type: postgresql
        host: pre-release-db.example.com
        port: 5432
        database: app_pre_release
        username: app_user
        password: ${PRE_RELEASE_DB_PASSWORD}
        ssl: true
        pool:
          min: 2
          max: 10
          idleTimeout: 30000
          connectionTimeout: 5000

      tests:
        - connectivity
        - query-performance
        - schema-validation
        - data-integrity

      queries:
        - name: simple-query
          sql: SELECT 1
          sla: 10
        - name: user-lookup
          sql: SELECT * FROM users WHERE id = $1 LIMIT 1
          params: ['123e4567-e89b-12d3-a456-426614174000']
          sla: 50
        - name: join-query
          sql: |
            SELECT u.id, u.email, COUNT(o.id) as order_count
            FROM users u
            LEFT JOIN orders o ON u.id = o.user_id
            GROUP BY u.id, u.email
            LIMIT 10
          sla: 200

      tables:
        - users
        - orders
        - products

      checks:
        - name: user-count
          description: Verify minimum user count
          query: SELECT COUNT(*) as count FROM users
          validation:
            field: count
            operator: '>='
            value: 100

    # Staging Environment
    staging:
      environment: staging
      database:
        type: postgresql
        host: staging-db.example.com
        port: 5432
        database: app_staging
        username: app_user
        password: ${STAGING_DB_PASSWORD}
        ssl: true
        pool:
          min: 2
          max: 10

      tests:
        - connectivity
        - query-performance
        - schema-validation
        - data-integrity
        - replication-health

      queries:
        - name: simple-query
          sql: SELECT 1
          sla: 10
        - name: table-scan
          sql: SELECT * FROM users LIMIT 1
          sla: 50
        - name: write-operation
          sql: |
            INSERT INTO smoke_test_logs (message, created_at)
            VALUES ('Smoke test', NOW())
            RETURNING id
          sla: 100
          cleanup: DELETE FROM smoke_test_logs WHERE message = 'Smoke test'

      tables:
        - users
        - orders
        - products
        - smoke_test_logs

      checks:
        - name: user-count
          description: Verify minimum user count
          query: SELECT COUNT(*) as count FROM users
          validation:
            field: count
            operator: '>='
            value: 100
        - name: orphaned-orders
          description: Check for orders without users
          query: |
            SELECT COUNT(*) as count FROM orders o
            WHERE NOT EXISTS (SELECT 1 FROM users u WHERE u.id = o.user_id)
          validation:
            field: count
            operator: '='
            value: 0

      replication:
        maxLag: 1000
        replicas:
          - host: staging-db-replica-1.example.com
            port: 5432
          - host: staging-db-replica-2.example.com
            port: 5432

    # Canary Environment (5% traffic)
    canary5:
      environment: canary-5
      database:
        type: postgresql
        host: canary-db.example.com
        port: 5432
        database: app_production
        username: app_user
        password: ${CANARY_DB_PASSWORD}
        ssl: true

      tests:
        - connectivity
        - query-performance

      queries:
        - name: simple-query
          sql: SELECT 1
          sla: 10
        - name: table-scan
          sql: SELECT * FROM users LIMIT 1
          sla: 50

    # Canary Environment (25% traffic)
    canary25:
      environment: canary-25
      database:
        type: postgresql
        host: canary-db.example.com
        port: 5432
        database: app_production
        username: app_user
        password: ${CANARY_DB_PASSWORD}
        ssl: true

      tests:
        - connectivity
        - query-performance
        - data-integrity

      queries:
        - name: simple-query
          sql: SELECT 1
          sla: 10
        - name: table-scan
          sql: SELECT * FROM users LIMIT 1
          sla: 50
        - name: join-query
          sql: |
            SELECT u.id, u.email, COUNT(o.id) as order_count
            FROM users u
            LEFT JOIN orders o ON u.id = o.user_id
            GROUP BY u.id, u.email
            LIMIT 10
          sla: 200

      checks:
        - name: user-count
          description: Verify minimum user count
          query: SELECT COUNT(*) as count FROM users
          validation:
            field: count
            operator: '>='
            value: 100

    # Canary Environment (100% traffic)
    canary100:
      environment: canary-100
      database:
        type: postgresql
        host: canary-db.example.com
        port: 5432
        database: app_production
        username: app_user
        password: ${CANARY_DB_PASSWORD}
        ssl: true

      tests:
        - connectivity
        - query-performance
        - schema-validation
        - data-integrity
        - replication-health

      queries:
        - name: simple-query
          sql: SELECT 1
          sla: 10
        - name: table-scan
          sql: SELECT * FROM users LIMIT 1
          sla: 50
        - name: join-query
          sql: |
            SELECT u.id, u.email, COUNT(o.id) as order_count
            FROM users u
            LEFT JOIN orders o ON u.id = o.user_id
            GROUP BY u.id, u.email
            LIMIT 10
          sla: 200

      tables:
        - users
        - orders
        - products

      checks:
        - name: user-count
          description: Verify minimum user count
          query: SELECT COUNT(*) as count FROM users
          validation:
            field: count
            operator: '>='
            value: 100
        - name: orphaned-orders
          description: Check for orders without users
          query: |
            SELECT COUNT(*) as count FROM orders o
            WHERE NOT EXISTS (SELECT 1 FROM users u WHERE u.id = o.user_id)
          validation:
            field: count
            operator: '='
            value: 0

      replication:
        maxLag: 1000
        replicas:
          - host: production-db-replica-1.example.com
            port: 5432

    # Production Environment
    production:
      environment: production
      database:
        type: postgresql
        host: production-db.example.com
        port: 5432
        database: app_production
        username: app_user
        password: ${PRODUCTION_DB_PASSWORD}
        ssl: true
        pool:
          min: 5
          max: 20

      tests:
        - connectivity
        - query-performance
        - replication-health
        - backup-validation

      queries:
        - name: simple-query
          sql: SELECT 1
          sla: 10
        - name: table-scan
          sql: SELECT * FROM users LIMIT 1
          sla: 50

      replication:
        maxLag: 1000
        replicas:
          - host: production-db-replica-1.example.com
            port: 5432
          - host: production-db-replica-2.example.com
            port: 5432

      backup:
        maxAge: 86400000  # 24 hours
        path: /backups/postgres
        verifyChecksum: true

    # Post-Rollback Environment
    rollback:
      environment: rollback
      database:
        type: postgresql
        host: production-db.example.com
        port: 5432
        database: app_production
        username: app_user
        password: ${PRODUCTION_DB_PASSWORD}
        ssl: true

      tests:
        - connectivity
        - query-performance
        - schema-validation
        - data-integrity
        - replication-health

      queries:
        - name: simple-query
          sql: SELECT 1
          sla: 10
        - name: table-scan
          sql: SELECT * FROM users LIMIT 1
          sla: 50
        - name: join-query
          sql: |
            SELECT u.id, u.email, COUNT(o.id) as order_count
            FROM users u
            LEFT JOIN orders o ON u.id = o.user_id
            GROUP BY u.id, u.email
            LIMIT 10
          sla: 200

      tables:
        - users
        - orders
        - products

      checks:
        - name: user-count
          description: Verify user count maintained
          query: SELECT COUNT(*) as count FROM users
          validation:
            field: count
            operator: '>='
            value: 100
        - name: orphaned-orders
          description: Check for orders without users
          query: |
            SELECT COUNT(*) as count FROM orders o
            WHERE NOT EXISTS (SELECT 1 FROM users u WHERE u.id = o.user_id)
          validation:
            field: count
            operator: '='
            value: 0

      replication:
        maxLag: 1000
        replicas:
          - host: production-db-replica-1.example.com
            port: 5432

    # Performance SLA Targets
    slaTargets:
      connectivity: 1000      # Connection: ≤1000ms
      simpleQuery: 10         # SELECT 1: ≤10ms
      tableQuery: 50          # Table scan: ≤50ms
      joinQuery: 200          # Multi-table join: ≤200ms
      writeOperation: 100     # INSERT/UPDATE/DELETE: ≤100ms
      replicationLag: 1000    # Replication lag: ≤1000ms
      default: 30000          # Default timeout: ≤30000ms

