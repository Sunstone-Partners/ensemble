metadata:
  name: ensemble:trd
  description: Dispatch to a TRD-authoring, analysis, or implementation subcommand by keyword
  version: 1.0.0
  lastUpdated: "2026-10-05"
  category: planning
  output_path: ensemble/trd.md
  source: sunstone
  argument_hint: "<create|foreman|refine|workstream|implement|analyze|complexity|validate|verify|status|graph> [subcommand args...]"

mission:
  summary: |
    Thin routing layer over the existing TRD-adjacent commands (authoring, Foreman-native
    authoring, refinement, workstream normalization, beads-driven implementation, and the
    cross-artifact analysis/validation/verification/status/dependency-graph tools). Reads
    and follows the matching sibling command's own generated file for this runtime, passing
    the rest of $ARGUMENTS unchanged, and does not re-implement any of their phases. This
    group is intentionally heterogeneous -- not every subcommand below is a simple CRUD
    variant of one workflow, so read each one's own description carefully before picking it.

dispatch:
  subcommands:
    - keyword: create
      ref: create-trd
      description: Create a Technical Requirements Document from a PRD
    - keyword: foreman
      ref: create-trd-foreman
      description: Create a Foreman-native structured TRD from a PRD (no adversarial review phase, parser-compatible tables)
    - keyword: refine
      ref: refine-trd
      description: Refine and enhance an existing TRD with stakeholder feedback
    - keyword: workstream
      ref: create-workstream-trd
      description: Generate a normalized executable workstream TRD from multiple source TRDs
    - keyword: implement
      ref: implement-trd-beads
      description: Implement a TRD with beads project management (persistent bead hierarchy, br/bv-driven execution, cross-session resumability)
    - keyword: analyze
      ref: analyze-requirements
      description: Pre-implementation cross-artifact consistency sweep (PRD-TRD-beads alignment)
    - keyword: complexity
      ref: analyze-complexity
      description: Score work complexity and choose an adaptive Ensemble planning route
    - keyword: validate
      ref: validate-requirements
      description: Pre-implementation traceability gate (REQ-NNN coverage and TEST task pairing between PRD and TRD)
    - keyword: verify
      ref: verify-requirements
      description: Post-implementation REQ-AC-code traceability verifier with a proof report
    - keyword: status
      ref: requirement-status
      description: On-demand requirement satisfaction report scanned from bead comments
    - keyword: graph
      ref: trd-dependency-graph
      description: Build a dependency graph across TRDs and report likely-duplicate work

workflow:
  phases:
    - name: Dispatch
      order: 1
      steps:
        - order: 1
          title: Route by first argument token
          description: Parse $ARGUMENTS and hand off to the matching sibling command
          actions:
            - "Parse $ARGUMENTS. The first whitespace-delimited token selects a subcommand by its keyword below; the remaining text, unmodified, becomes that subcommand's own argument input."
            - "If the first token matches a keyword below: read and follow that subcommand's own generated command file for this runtime (see the Subcommands section this file renders), passing the remaining argument text through unmodified. Do not re-implement its phases here."
            - "If the first token matches no keyword, or $ARGUMENTS is empty: print the keyword table below (keyword + one-line description) and HALT without side effects."
